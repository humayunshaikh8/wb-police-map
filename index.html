<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>WB Police Live Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
  body { margin:0; }
  #map { height:100vh; width:100%; }
  .legend {
    background:white;
    padding:10px;
    line-height:18px;
    color:#333;
    font-weight:bold;
  }
</style>
</head>
<body>

<div id="map"></div>

<script>
const map = L.map('map').setView([22.5, 88.3], 8);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

Papa.parse("https://docs.google.com/spreadsheets/d/e/2PACX-1vQws1aF25SY9EK4d2o455DnhKd136BwBn7jhJ_PP4L6lLDU1j9cRiLyZf0ilCaeH0D1mz8RgwQoLV9k/gviz/tq?tqx=out:csv", {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {

        results.data.forEach(row => {

            let lat = parseFloat(String(row.lat).trim());
            let lon = parseFloat(String(row.lon).trim());

            // Skip rows where lat/lon is missing
            if (isNaN(lat) || isNaN(lon)) return;

            let caption = row.caption ? row.caption : "No Name";
            let hq = row.hq ? row.hq.trim() : "OTHER";

            let iconColor = {
                "HQ": "red",
                "PS": "blue",
                "TG": "orange",
                "OP": "green",
                "TOP": "violet",
                "ROP": "gold",
                "BOP": "black",
                "CAMP": "grey",
                "IC": "brown",
                "STG": "pink"
            }[hq] || "cadetblue";

            let icon = L.AwesomeMarkers.icon({
                icon: 'info-sign',
                markerColor: iconColor,
                prefix: 'glyphicon'
            });

            L.marker([lat, lon], { icon })
                .addTo(map)
                .bindPopup(`<b>${caption}</b><br>Type: ${hq}`);
        });
    }
});
</script>
</body>
</html>
