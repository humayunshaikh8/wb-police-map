<!DOCTYPE html>
<html>
<head>
    <title>WB Police Live Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <style>
        body { margin:0; padding:0; }
        #map { height: 100vh; width: 100vw; }
        .control-box {
            background: white;
            padding: 8px;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
            font-size: 14px;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script>
const map = L.map('map').setView([22.8, 88.3], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
}).addTo(map);

const markers = L.markerClusterGroup();
map.addLayer(markers);

function getIcon(type) {
    let color = "red";
    if (type === "PS") color = "blue";
    else if (type === "HQ") color = "green";
    else if (type === "ROP") color = "yellow";
    else if (type === "IC") color = "violet";
    else if (type === "CAMP") color = "orange";
    else if (type === "TG") color = "grey";
    else if (type === "TOP") color = "black";
    else if (type === "BOP") color = "gold";

    return L.icon({
        iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${color}.png`,
        shadowUrl: 'https://unpkg.com/leaflet@1.7.1/dist/images/marker-shadow.png',
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
    });
}

function cleanCoord(value) {
    if (!value) return NaN;
    return parseFloat(value.replace(/[^\d.\-]/g, ''));
}

fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vQws1aF25SY9EK4d2o455DnhKd136BwBn7jhJ_PP4L6lLDU1j9cRiLyZf0ilCaeH0D1mz8RgwQoLV9k/pub?gid=0&single=true&output=tsv")
.then(res => res.text())
.then(data => {
    const rows = data.trim().split("\n").map(r => r.split("\t"));

    rows.slice(1).forEach(row => {
        const len = row.length;

        const caption = row[len - 4] || "No Name";
        const lat = cleanCoord(row[len - 3]);
        const lon = cleanCoord(row[len - 2]);
        const type = (row[len - 1] || "OTHER").trim().toUpperCase();

        if (
            !isNaN(lat) &&
            !isNaN(lon) &&
            lat > 20 && lat < 28 &&
            lon > 85 && lon < 90
        ) {
            const marker = L.marker([lat, lon], { icon: getIcon(type) })
                .bindPopup(`<b>${caption}</b><br>Type: ${type}<br>Lat: ${lat}<br>Lon: ${lon}`);

            markers.addLayer(marker);
        }
    });

    if (markers.getLayers().length > 0) {
        map.fitBounds(markers.getBounds());
    } else {
        alert("No valid coordinates found in last 4 columns.");
    }
});
</script>

</body>
</html>
