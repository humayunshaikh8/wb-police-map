<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>WB Police Live Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
  body { margin:0; }
  #map { height:100vh; width:100%; }
  .legend {
    background:white;
    padding:10px;
    line-height:18px;
    color:#333;
    font-weight:bold;
  }
</style>
</head>
<body>

<div id="map"></div>

<script>
// 🔹 Create Map
var map = L.map('map').setView([23.5, 87.5], 7);

// 🔹 Google-like map tiles
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

// 🔹 Category colors
const colors = {
  PS: "blue",
  TG: "green",
  OP: "orange",
  TOP: "red",
  ROP: "violet",
  BOP: "yellow",
  CAMP: "black",
  IC: "grey",
  STG: "gold"
};

// 🔹 Icon function
function getIcon(color) {
  return new L.Icon({
    iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${color}.png`,
    shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
  });
}

// 🔹 Load Google Sheet CSV
Papa.parse("https://docs.google.com/spreadsheets/d/e/2PACX-1vQws1aF25SY9EK4d2o455DnhKd136BwBn7jhJ_PP4L6lLDU1j9cRiLyZf0ilCaeH0D1mz8RgwQoLV9k/gviz/tq?tqx=out:csv
", {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: function(results) {

    let bounds = [];

    results.data.forEach(row => {
      let lat = parseFloat(row.lat);
      let lon = parseFloat(row.lon);

      // Skip invalid points
      if (isNaN(lat) || isNaN(lon)) return;
      if (lat < -90 || lat > 90) return;
      if (lon < -180 || lon > 180) return;

      let category = row.hq ? row.hq.trim() : "PS";
      let color = colors[category] || "blue";

      let marker = L.marker([lat, lon], {
        icon: getIcon(color)
      }).addTo(map);

      marker.bindPopup(`<b>${row.caption}</b><br>Category: ${category}`);

      bounds.push([lat, lon]);
    });

    if (bounds.length > 0) map.fitBounds(bounds);

  }
});

// 🔹 Legend
var legend = L.control({position: 'bottomright'});
legend.onAdd = function () {
  var div = L.DomUtil.create('div', 'legend');
  div.innerHTML += "Legend<br>";
  for (let key in colors) {
    div.innerHTML +=
      `<img src="https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${colors[key]}.png" height="20"> ${key}<br>`;
  }
  return div;
};
legend.addTo(map);

</script>
</body>
</html>
