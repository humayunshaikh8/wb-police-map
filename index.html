<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>WB Police Live Location Map</title>

<!-- Leaflet Core -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<!-- Marker Cluster -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css"/>

<!-- Search Control -->
<link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css"/>

<style>
body { margin:0; font-family: 'Segoe UI', sans-serif; }

#map { height:100vh; width:100%; }

.topbar {
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    background:linear-gradient(90deg,#0d47a1,#1976d2);
    color:white;
    padding:10px 25px;
    border-radius:30px;
    font-weight:600;
    font-size:18px;
    z-index:999;
    box-shadow:0 4px 10px rgba(0,0,0,0.25);
}

.legend {
    position:absolute;
    bottom:20px;
    left:20px;
    background:white;
    padding:12px 15px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
    font-size:13px;
    z-index:999;
}

.legend div { margin-bottom:6px; }

.filter-box {
    position:absolute;
    top:80px;
    left:20px;
    background:white;
    padding:12px;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
    z-index:999;
}

.filter-box select {
    width:160px;
    padding:6px;
    border-radius:6px;
    border:1px solid #ccc;
}

/* Popup Premium Style */
.popup-card { min-width:180px; }
.popup-title {
    font-weight:700;
    font-size:16px;
    color:#0d47a1;
    margin-bottom:6px;
}
.popup-type {
    display:inline-block;
    padding:4px 10px;
    border-radius:14px;
    font-size:12px;
    font-weight:600;
    color:white;
    background:linear-gradient(135deg,#3949ab,#1e88e5);
}
</style>
</head>

<body>

<div class="topbar">🚓 WB Police Live Unit Map</div>

<div class="filter-box">
    <b>Filter by Type</b><br>
    <select id="typeFilter">
        <option value="ALL">All Units</option>
    </select>
</div>

<div class="legend">
    <b>Legend</b>
    <div>🔴 PS</div>
    <div>🟢 ROP</div>
    <div>🔵 IC</div>
    <div>🟣 CAMP</div>
    <div>🟠 OP</div>
    <div>🟡 TG</div>
</div>

<div id="map"></div>

<!-- JS Libraries -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<script>

// MAP INIT
var map = L.map('map').setView([23.5, 87.5], 7);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'© OpenStreetMap'
}).addTo(map);

var markers = L.markerClusterGroup();
map.addLayer(markers);

// 🔁 YOUR TSV LINK
var sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQws1aF25SY9EK4d2o455DnhKd136BwBn7jhJ_PP4L6lLDU1j9cRiLyZf0ilCaeH0D1mz8RgwQoLV9k/pub?gid=0&single=true&output=tsv";

// 🎯 ICONS
function getIcon(type){
    var color="blue";
    if(type=="PS") color="red";
    else if(type=="ROP") color="green";
    else if(type=="IC") color="blue";
    else if(type=="CAMP") color="purple";
    else if(type=="OP") color="orange";
    else if(type=="TG") color="yellow";

    return new L.Icon({
        iconUrl:`https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${color}.png`,
        shadowUrl:'https://unpkg.com/leaflet@1.7.1/dist/images/marker-shadow.png',
        iconSize:[25,41],
        iconAnchor:[12,41],
        popupAnchor:[1,-34]
    });
}

// 🔍 FIND COLUMN INDEX SAFELY
function findIndex(headers, names){
    for(let n of names){
        let idx = headers.findIndex(h => h.trim().toLowerCase() === n);
        if(idx !== -1) return idx;
    }
    return -1;
}

// 📡 LOAD DATA
fetch(sheetURL)
.then(r => r.text())
.then(data => {

    var rows = data.trim().split("\n");
    var headers = rows[0].split("\t").map(h => h.trim().toLowerCase());

    var captionIndex = findIndex(headers, ["caption","name"]);
    var latIndex = findIndex(headers, ["lat","latitude"]);
    var lonIndex = findIndex(headers, ["lon","lng","longitude"]);
    var typeIndex = findIndex(headers, ["hq","type","category"]);

    console.log("Detected columns:", captionIndex, latIndex, lonIndex, typeIndex);

    var typesSet = new Set();

    for(var i=1; i<rows.length; i++){
        var cols = rows[i].split("\t");

        var caption = cols[captionIndex] ? cols[captionIndex].trim() : "";
        var lat = parseFloat(cols[latIndex]);
        var lon = parseFloat(cols[lonIndex]);
        var type = cols[typeIndex] ? cols[typeIndex].trim() : "Unit";

        // 🚫 Skip bad rows
        if(!caption || isNaN(lat) || isNaN(lon)) continue;

        typesSet.add(type);

        var marker = L.marker([lat,lon],{icon:getIcon(type), unitType:type})
            .bindPopup(`
                <div class="popup-card">
                    <div class="popup-title">${caption}</div>
                    <div class="popup-type">${type}</div>
                </div>
            `);

        markers.addLayer(marker);
    }

    // FILTER DROPDOWN
    var filter = document.getElementById("typeFilter");
    typesSet.forEach(t=>{
        var opt = document.createElement("option");
        opt.value = t;
        opt.text = t;
        filter.appendChild(opt);
    });

});
</script>
</body>
</html>
