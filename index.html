<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WB Police Force Details</title>

    <!-- Leaflet + Cluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

    <style>
        :root {
            --brand1: #0d47a1;
            --brand2: #1976d2;
            --brand3: #1e88e5;
            --glass: rgba(255, 255, 255, 0.88);
            --glassBorder: rgba(255, 255, 255, 0.38);
            --shadow1: 0 18px 45px rgba(0, 0, 0, 0.32);
            --shadow2: 0 10px 28px rgba(0, 0, 0, 0.20);
            --shadow3: 0 6px 18px rgba(0, 0, 0, 0.16);
            --radiusXL: 22px;
            --radiusL: 16px;
            --radiusPill: 999px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f4f6f9;
            overflow: hidden;
        }

        /* MAP */
        #map {
            height: 100vh;
            width: 100vw;
            filter: saturate(1.05) contrast(1.05);
            z-index: 1;
        }

        /* IMPORTANT: make Google suggestions always clickable above our panels */
        .pac-container {
            z-index: 100000 !important;
            pointer-events: auto !important;
        }

        /* HEADER */
        .header {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, var(--brand1), var(--brand2));
            color: white;
            padding: 12px 30px;
            border-radius: 40px;
            font-weight: 900;
            letter-spacing: .6px;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.25);
            z-index: 3500;
            user-select: none;
            display: none;
        }

        /* GLASS PANELS */
        .legend,
        .filterBox,
        #googleSearchBox,
        #userMenu,
        #legendPanel {
            position: fixed;
            background: var(--glass);
            border: 1px solid var(--glassBorder);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 14px;
            box-shadow: var(--shadow3);
            z-index: 3000;
        }

        /* FILTER BOX */
        .filterBox {
            top: 85px;
            left: 20px;
            padding: 14px 14px 12px 14px;
            min-width: 260px;
            display: none;
        }

        .filterBox b {
            display: inline-block;
            margin-bottom: 8px;
            color: #0b2f6f;
            font-size: 13px;
            letter-spacing: .2px;
        }

        #typeFilter,
        #searchBox {
            width: 100%;
            padding: 10px 10px;
            border-radius: 12px;
            border: 1px solid rgba(13, 71, 161, 0.18);
            outline: none;
            background: rgba(255, 255, 255, 0.92);
            font-family: 'Segoe UI', sans-serif;
        }

        #typeFilter {
            font-weight: 700;
            color: #0d47a1;
        }

        #typeFilter:focus,
        #searchBox:focus {
            border-color: rgba(30, 136, 229, 0.65);
            box-shadow: 0 0 0 4px rgba(30, 136, 229, 0.16);
        }

        /* LOGIN SCREEN */
        #loginScreen {
            position: fixed;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--brand1), var(--brand2));
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 8000;
        }

        .loginBox {
            background: rgba(255, 255, 255, 0.96);
            padding: 38px 34px;
            border-radius: var(--radiusXL);
            width: 360px;
            text-align: center;
            box-shadow: var(--shadow1);
            border: 1px solid rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .loginBox h2 {
            margin: 0 0 12px 0;
            color: #0b2f6f;
            letter-spacing: .4px;
            font-weight: 900;
        }

        .loginBox .hint {
            margin: 0 0 12px 0;
            font-size: 12.5px;
            color: rgba(11, 47, 111, 0.80);
            font-weight: 650;
        }

        .loginBox input {
            width: 100%;
            margin: 10px 0;
            padding: 12px 12px;
            border-radius: 14px;
            border: 1px solid rgba(13, 71, 161, 0.18);
            outline: none;
            background: rgba(255, 255, 255, 0.92);
            font-family: 'Segoe UI', sans-serif;
        }

        .loginBox input:focus {
            border-color: rgba(30, 136, 229, 0.65);
            box-shadow: 0 0 0 4px rgba(30, 136, 229, 0.16);
        }

        .loginBox button {
            width: 100%;
            padding: 12px 12px;
            background: linear-gradient(135deg, #1565c0, #1e88e5);
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 900;
            letter-spacing: .2px;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(25, 118, 210, 0.25);
            transition: transform .14s ease, box-shadow .14s ease;
        }

        .loginBox button:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 30px rgba(25, 118, 210, 0.35);
        }

        .loginBox button:active {
            transform: translateY(0px) scale(0.99);
        }

        #loginError {
            color: #d32f2f;
            font-size: 13px;
            margin: 10px 0 0 0;
            min-height: 16px;
            font-weight: 700;
        }

        /* TOP BAR */
        #topBar {
            position: fixed;
            top: 15px;
            right: 20px;
            z-index: 3600;
            font-family: 'Segoe UI';
            display: none;
            width: 360px;
            max-width: calc(100vw - 40px);
        }

        #userInfo {
            background: linear-gradient(135deg, #1565c0, #1e88e5);
            color: white;
            padding: 10px 16px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.26);
            font-weight: 900;
            transition: transform .18s ease, box-shadow .18s ease;
            user-select: none;
            display: inline-block;
        }

        #userInfo:hover {
            transform: scale(1.05);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.28);
        }

        #userMenu {
            display: none;
            position: relative;
            margin-top: 10px;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.22);
        }

        .menuItem {
            padding: 12px 16px;
            cursor: pointer;
            font-weight: 800;
            transition: .2s;
            white-space: nowrap;
            color: #0b2f6f;
        }

        .menuItem:hover {
            background: linear-gradient(90deg, #e3f2fd, #bbdefb);
        }

        /* PLACE SEARCH */
        #googleSearchBox {
            position: relative;
            margin-top: 12px;
            padding: 8px 14px;
            border-radius: 30px;
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.20);
            display: none;
            align-items: center;
            gap: 10px;
        }

        .placeIconBtn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(13, 71, 161, 0.10), rgba(30, 136, 229, 0.14));
            border: 1px solid rgba(13, 71, 161, 0.14);
            color: #0b2f6f;
            font-weight: 900;
            user-select: none;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.10);
            cursor: pointer;
            padding: 0;
            outline: none;
        }

        .placeIconBtn:active {
            transform: scale(0.98);
        }

        #googleSearchBox input {
            border: none;
            outline: none;
            width: 220px;
            font-size: 14px;
            background: transparent;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 650;
            color: #0b2f6f;
        }

        #clearSearch {
            cursor: pointer;
            margin-left: 2px;
            display: none;
            user-select: none;
            font-weight: 900;
            opacity: .75;
            transition: .2s;
            color: #0b2f6f;
        }

        #clearSearch:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        /* LEGEND PANEL (slightly lower than before) */
        #legendPanel {
            position: relative;
            margin-top: 175px;
            /* ✅ slightly lower so suggestions never hide */
            padding: 12px 12px 10px 12px;
            border-radius: 14px;
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.18);
            display: none;
            overflow: hidden;
        }

        .legendHeader {
            display: none;
        }

        .legend hr {
            border: none;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            margin: 10px 0;
        }

        .legendRow {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 6px;
            border-radius: 12px;
            transition: .18s;
            user-select: none;
            break-inside: avoid;
            white-space: nowrap;
        }

        .legendRow:hover {
            background: linear-gradient(90deg, rgba(227, 242, 253, 0.85), rgba(187, 222, 251, 0.75));
        }

        .legendRow input[type="checkbox"] {
            transform: scale(1.08);
            cursor: pointer;
        }

        .legendDot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: inline-block;
            border: 3px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
            flex: 0 0 auto;
        }

        .legendText {
            font-size: 12.5px;
            font-weight: 900;
            color: #0b2f6f;
            letter-spacing: .12px;
            line-height: 1.05;
            white-space: nowrap;
        }

        #legendList {
            column-count: 2;
            column-gap: 14px;
        }

        /* USER MANAGEMENT MODAL */
        #userPanelModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            justify-content: center;
            align-items: center;
            z-index: 7500;
        }

        #userPanelModal .loginBox h3 {
            margin: 0 0 12px 0;
            color: #0b2f6f;
            font-weight: 900;
        }

        #userPanelModal .loginBox hr {
            border: none;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            margin: 14px 0;
        }

        #userPanelModal .loginBox button.closeBtn {
            background: linear-gradient(135deg, #8e8e8e, #b0b0b0);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.18);
            margin-top: 10px;
        }

        #userPanelModal .loginBox button.secondaryBtn {
            background: linear-gradient(135deg, #455a64, #607d8b);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.18);
            margin-top: 10px;
        }

        #userMsg {
            margin: 10px 0 0 0;
            font-size: 13px;
            min-height: 16px;
            color: #0b2f6f;
            font-weight: 800;
        }

        /* premium pulse for markers */
        @keyframes premiumPulse {
            0% {
                transform: translateZ(0) scale(1);
                filter: brightness(1);
            }

            50% {
                transform: translateZ(0) scale(1.05);
                filter: brightness(1.15);
            }

            100% {
                transform: translateZ(0) scale(1);
                filter: brightness(1);
            }
        }

        /* LOADING OVERLAY */
        #loadingScreen {
            position: fixed;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--brand1), var(--brand2));
            color: white;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: .3px;
            z-index: 7000;
            user-select: none;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 16px !important;
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.30) !important;
            overflow: hidden;
        }

        .leaflet-popup-content {
            margin: 0 !important;
        }

        .leaflet-control-zoom a {
            border-radius: 10px !important;
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.16) !important;
        }

        /* ✅ MOBILE COMPATIBLE MODE */
        @media (max-width: 900px) {
            .filterBox {
                top: 80px;
                left: 14px;
                min-width: 240px;
            }

            #topBar {
                right: 14px;
                width: 340px;
            }
        }

        @media (max-width: 740px) {
            #topBar {
                right: 10px;
                left: 10px;
                width: auto;
                max-width: none;
            }

            #userInfo {
                width: 100%;
                text-align: center;
            }

            #googleSearchBox {
                width: 100%;
                padding: 10px 12px;
            }

            #googleSearchBox input {
                width: 100%;
            }

            #legendPanel {
                width: 100%;
                margin-top: 190px;
                /* more space on mobile */
            }

            #legendList {
                column-count: 1;
            }

            .filterBox {
                left: 10px;
                right: 10px;
                min-width: unset;
                width: auto;
                top: calc(15px + 48px + 12px + 48px + 12px);
                /* after top elements */
            }
        }

        @media (max-width: 480px) {

            /* On small phones: allow legend scroll so all items accessible */
            #legendPanel {
                margin-top: 205px;
                max-height: 55vh;
                overflow: auto;
            }

            .loginBox {
                width: calc(100vw - 40px);
            }
        }
    </style>
</head>

<body>

    <div class="header" id="pageHeader">WB Police Force Details</div>

    <div class="filterBox" id="filterBox">
        <b>Filter by Unit Type</b><br>
        <select id="typeFilter">
            <option value="ALL">All Units</option>
        </select>
        <br><br>
        <input type="text" id="searchBox" placeholder="Search unit name...">
    </div>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen">
        <div class="loginBox">
            <h2>WB Police Force Details</h2>
            <p class="hint">Default Login: <b>admin</b> / <b>admin</b></p>
            <input type="text" id="username" placeholder="Username" value="admin" autocomplete="username">
            <input type="password" id="password" placeholder="Password" value="admin" autocomplete="current-password">
            <button id="loginBtn" onclick="login()">Login</button>
            <p id="loginError"></p>
        </div>
    </div>

    <!-- TOP RIGHT BAR -->
    <div id="topBar">
        <div id="userInfo" onclick="toggleMenu()">
            👤 <span id="loggedUser"></span> ☰
        </div>

        <div id="userMenu">
            <div class="menuItem" onclick="openUserPanel()">User Management</div>
            <div class="menuItem" onclick="logout()">Logout</div>
        </div>

        <!-- Place Search box -->
        <div id="googleSearchBox">
            <button class="placeIconBtn" id="pinBtn" title="Place Search" type="button">📍</button>
            <input id="pac-input" type="text" placeholder="Search place...">
            <button class="placeIconBtn" id="searchBtn" title="Search" type="button">🔎</button>
            <span id="clearSearch" title="Clear">✖</span>
        </div>

        <!-- Legend panel -->
        <div class="legend" id="legendPanel">
            <div class="legendRow" style="padding:8px 6px;">
                <input type="checkbox" id="selectAllLegend" checked>
                <span class="legendText">Select All</span>
            </div>

            <hr>

            <div id="legendList"></div>
        </div>
    </div>

    <!-- USER MANAGEMENT MODAL -->
    <div id="userPanelModal">
        <div class="loginBox">
            <h3>User Management</h3>

            <input type="text" id="newUser" placeholder="New Username">
            <input type="password" id="newPass" placeholder="New Password">
            <button onclick="createUser()">Create User</button>

            <hr>

            <input type="text" id="changeUser" placeholder="Username">
            <input type="password" id="changePass" placeholder="New Password">
            <button onclick="changePassword()">Change Password</button>

            <button class="secondaryBtn" onclick="downloadUsersTxt()">Download users.txt</button>

            <button class="closeBtn" onclick="closeUserPanel()">Close</button>
            <p id="userMsg"></p>
        </div>
    </div>

    <!-- LOADING SCREEN -->
    <div id="loadingScreen">Loading Map Data...</div>

    <!-- MAP -->
    <div id="map"></div>

    <!-- Leaflet + Cluster JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

    <script>
        /********************************************************************
         * FIXES ADDED NOW:
         * ✅ Google suggestions click works (z-index pac-container)
         * ✅ Search icon button works (click 🔎 to search even without Enter)
         * ✅ Legend panel slightly lower
         * ✅ Mobile compatible layout + legend scroll on small screens
         ********************************************************************/

        // ---------- CONFIG ----------
        var GOOGLE_PLACES_API_KEY = "AIzaSyBiP3uf8ZRTvrGB6zsce2iVWj1H_IFnMsg";
        var sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQws1aF25SY9EK4d2o455DnhKd136BwBn7jhJ_PP4L6lLDU1j9cRiLyZf0ilCaeH0D1mz8RgwQoLV9k/pub?gid=0&single=true&output=tsv";

        // ---------- ELEMENTS ----------
        var loginScreenEl = document.getElementById("loginScreen");
        var loginErrorEl = document.getElementById("loginError");
        var pageHeaderEl = document.getElementById("pageHeader");
        var topBarEl = document.getElementById("topBar");
        var googleSearchBoxEl = document.getElementById("googleSearchBox");
        var filterBoxEl = document.getElementById("filterBox");
        var loggedUserEl = document.getElementById("loggedUser");
        var userMenuEl = document.getElementById("userMenu");
        var userPanelModalEl = document.getElementById("userPanelModal");
        var loadingScreenEl = document.getElementById("loadingScreen");

        var legendPanelEl = document.getElementById("legendPanel");
        var legendListEl = document.getElementById("legendList");
        var selectAllLegendEl = document.getElementById("selectAllLegend");

        var typeFilterEl = document.getElementById("typeFilter");
        var searchBoxEl = document.getElementById("searchBox");

        var pacInputEl = document.getElementById("pac-input");
        var clearBtn = document.getElementById("clearSearch");
        var searchBtn = document.getElementById("searchBtn");
        var pinBtn = document.getElementById("pinBtn");

        // ---------- DEFAULT USERS ----------
        if (!localStorage.getItem("users")) {
            localStorage.setItem("users", JSON.stringify({ "admin": "admin" }));
        } else {
            var _usersEnsure = JSON.parse(localStorage.getItem("users"));
            if (!_usersEnsure["admin"]) {
                _usersEnsure["admin"] = "admin";
                localStorage.setItem("users", JSON.stringify(_usersEnsure));
            }
        }

        // ---------- MAP VARIABLES ----------
        var map = null;
        var markers = null;
        var searchMarker = null;

        // Cached data
        var cachedRows = [];
        var cachedTypes = new Set();

        // Legend SHOW set for HQ values
        var activeHQ = new Set();

        var isDataLoadedOnce = false;
        var googlePlacesLoaded = false;
        var uiEventsBound = false;

        // Google places objects
        var autocomplete = null;
        var lastSelectedPlace = null;
        var placeService = null;
        var geocoder = null;

        // ---------- COLORS ----------
        function getHQColor(hq) {
            const colors = {
                "DG RESERVE": "#e6194b",
                "L&O DUTY": "#3cb44b",
                "AG": "#ffe119",
                "RAF": "#4363d8",
                "LADY RAF": "#f58231",
                "STRACO": "#911eb4",
                "QRT": "#42d4f4",
                "WINNERS TEAM": "#f032e6",
                "DMG": "#bfef45",
                "HQ": "#fabed4",
                "EF LINES": "#469990",
                "PS": "#914150",
                "OP": "#9A6324",
                "TOP": "#fffac8",
                "IC": "#800000",
                "BOP": "#aaffc3",
                "ROP": "#808000",
                "BEAT HOUSE": "#ffd8b1",
                "TG": "#000075",
                "STG": "#a9a9a9",
                "CAMP": "#42f572",
                "HOUSE GUARD": "#968859",
                "AS CHECK": "#e6beff",
                "COURT": "#42f5e6",
                "OFFICE": "#c98d8d",
                "OTHERS": "#000000"
            };
            return colors[hq] || "#000000";
        }

        function createPremiumIcon(color, count) {

  var badgeHtml = "";

  if (count && count > 1) {
    badgeHtml = `
      <div style="
        position:absolute;
        top:-6px;
        right:-6px;
        background:#ff1744;
        color:white;
        width:20px;
        height:20px;
        border-radius:50%;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:11px;
        font-weight:900;
        box-shadow:0 0 6px rgba(0,0,0,0.5);
      ">
        ${count}
      </div>
    `;
  }

  return L.divIcon({
    className: "",
    html: `
      <div style="
        position:relative;
        width:34px;
        height:34px;
      ">
        <div style="
          width:34px;
          height:34px;
          border-radius:50%;
          background: radial-gradient(circle at 30% 30%, #ffffff 0%, ${color} 35%, ${color} 65%, rgba(0,0,0,0.25) 100%);
          border:4px solid rgba(255,255,255,0.98);
          box-shadow: 0 0 10px ${color}, 0 0 18px ${color}, 0 0 32px rgba(0,0,0,0.55);
          animation: premiumPulse 1.8s infinite;
        ">
        </div>

        ${badgeHtml}
      </div>
    `,
    iconSize: [40, 40],
    iconAnchor: [20, 20]
  });
}


        // ---------- LEGEND ITEMS (HQ list) ----------
        var legendItems = {
            "DG RESERVE": "#e6194b",
            "L&O DUTY": "#3cb44b",
            "AG": "#ffe119",
            "RAF": "#4363d8",
            "LADY RAF": "#f58231",
            "STRACO": "#911eb4",
            "QRT": "#42d4f4",
            "WINNERS TEAM": "#f032e6",
            "DMG": "#bfef45",
            "HQ": "#fabed4",
            "EF LINES": "#469990",
            "PS": "#914150",
            "OP": "#9A6324",
            "TOP": "#fffac8",
            "IC": "#800000",
            "BOP": "#aaffc3",
            "ROP": "#808000",
            "BEAT HOUSE": "#ffd8b1",
            "TG": "#000075",
            "STG": "#a9a9a9",
            "CAMP": "#42f572",
            "HOUSE GUARD": "#968859",
            "AS CHECK": "#e6beff",
            "COURT": "#42f5e6",
            "OFFICE": "#c98d8d",
            "OTHERS": "#000000"
        };

        function buildLegendPanel() {
            legendListEl.innerHTML = "";
            activeHQ.clear();

            for (var k in legendItems) activeHQ.add(k);

            for (var key in legendItems) {
                var row = document.createElement("div");
                row.className = "legendRow";
                row.innerHTML = `
          <input type="checkbox" class="unitShowCheck" value="${key}" checked>
          <span class="legendDot" style="background:${legendItems[key]};"></span>
          <span class="legendText">${key}</span>
        `;
                legendListEl.appendChild(row);
            }

            selectAllLegendEl.checked = true;
            legendPanelEl.style.display = "block";
        }

        // Prevent our panels from dragging map (but suggestions remain clickable because pac-container is outside)
        function stopMapInteractionOnPanel(el) {
            if (!el) return;
            ["mousedown", "touchstart", "dblclick", "wheel"].forEach(function (evt) {
                el.addEventListener(evt, function (e) { e.stopPropagation(); }, { passive: false });
            });
        }
        stopMapInteractionOnPanel(legendPanelEl);
        stopMapInteractionOnPanel(googleSearchBoxEl);
        stopMapInteractionOnPanel(filterBoxEl);

        // ---------- DATA PARSING ----------
        function parseTSVToCache(tsvText) {
            cachedRows = [];
            cachedTypes.clear();

            var rows = tsvText.split("\n");
            var maxRows = Math.min(rows.length, 4000);

            for (var i = 1; i < maxRows; i++) {
                if (!rows[i] || rows[i].trim() === "") continue;

                var cols = rows[i].split("\t");
                if (cols.length < 32) continue;

                var type = cols[1] ? cols[1].trim() : "";
                var caption = cols[28] ? cols[28].trim() : "";
                var lat = parseFloat(cols[29]);
                var lon = parseFloat(cols[30]);
                var hq = (cols[31] ? cols[31].trim() : "") || "";

                if (!type || !caption || isNaN(lat) || isNaN(lon)) continue;

                cachedTypes.add(type);

                var fullText = caption.replace(/\n/g, " ").replace(/\s+/g, " ").trim();
                var firstLine = caption.split("\n")[0] || "";
                var unitName = firstLine
                    .replace(/Actual Strength.*/i, "")
                    .replace(/AVAILABLE STRENGTH.*/i, "")
                    .replace(/Contact No.*/i, "")
                    .trim();

                var actualMatch = fullText.match(/Actual Strength\s*---\s*(.*?)(AVAILABLE STRENGTH|Contact No|$)/i);
                var actualStrength = actualMatch ? actualMatch[1].replace(/,\s*$/, "").trim() : "";

                var availableMatch = fullText.match(/AVAILABLE STRENGTH\s*---\s*(.*?)(Contact No|$)/i);
                var availableStrength = availableMatch ? availableMatch[1].replace(/,\s*$/, "").trim() : "";

                var contactMatch = fullText.match(/Contact No[:\-]*\s*(.*)$/i);
                var contact = contactMatch ? contactMatch[1].trim() : "";

                cachedRows.push({
                    type: type,
                    caption: caption,
                    lat: lat,
                    lon: lon,
                    hq: hq,
                    unitName: unitName,
                    actualStrength: actualStrength,
                    availableStrength: availableStrength,
                    contact: contact
                });
            }
        }

        function showLoading(show) {
            loadingScreenEl.style.display = show ? "flex" : "none";
        }

        function fillTypeDropdownOnce() {
            if (typeFilterEl.options.length > 1) return;

            var arr = Array.from(cachedTypes);
            arr.sort(function (a, b) { return a.localeCompare(b); });

            for (var i = 0; i < arr.length; i++) {
                var opt = document.createElement("option");
                opt.value = arr[i];
                opt.text = arr[i];
                typeFilterEl.appendChild(opt);
            }
        }

        // ---------- RENDER MARKERS ----------
        function renderMarkersFromCache() {
  if (!map || !markers) return;

  markers.clearLayers();

  var selectedType = (typeFilterEl && typeFilterEl.value) ? typeFilterEl.value : "ALL";
  var searchText = (searchBoxEl && searchBoxEl.value) ? searchBoxEl.value.trim().toLowerCase() : "";

  var bounds = [];

  // 🔹 STEP 1: GROUP BY LAT-LON
  var locationMap = {};

  for (var i = 0; i < cachedRows.length; i++) {
    var item = cachedRows[i];
    var hqKey = (item.hq || "").trim();

    if (activeHQ.size > 0 && !activeHQ.has(hqKey)) continue;

    if (selectedType !== "ALL" && item.type !== selectedType) continue;
    if (searchText && item.caption.toLowerCase().indexOf(searchText) === -1) continue;

    var key = item.lat + "," + item.lon;

    if (!locationMap[key]) {
      locationMap[key] = [];
    }

    locationMap[key].push(item);
  }

  // 🔹 STEP 2: CREATE ONE MARKER PER LOCATION
  for (var coord in locationMap) {

    var items = locationMap[coord];
    var first = items[0];

    var lat = first.lat;
    var lon = first.lon;
    var hqKey = (first.hq || "").trim();
    var color = legendItems[hqKey] || getHQColor(first.hq);

    var popupHtml = "";

    // 🔹 STEP 3: BUILD MULTIPLE UNIT LIST
    if (items.length === 1) {

      popupHtml = buildUnitPopup(items[0]);

    } else {

      popupHtml += `
        <div style="min-width:280px;font-family:'Segoe UI';">
          <div style="
            background:linear-gradient(135deg,#0d47a1,#1976d2);
            color:white;
            padding:10px 12px;
            font-weight:900;
            font-size:14px;">
            ${items.length} Units at this Location
          </div>
          <div style="padding:10px;">
      `;

      for (var j = 0; j < items.length; j++) {
        popupHtml += `
          <div style="
            margin-bottom:8px;
            padding:8px;
            border-radius:10px;
            background:#f5f5f5;
            cursor:pointer;
          "
          onclick="showSingleUnitPopup(${lat},${lon},${j})">
            ${escapeHtml(items[j].unitName)}
          </div>
        `;
      }

      popupHtml += `
          </div>
        </div>
      `;
    }

    var marker = L.marker([lat, lon], {
  icon: createPremiumIcon(color, items.length)
})
.bindPopup(popupHtml);

    marker._multiUnits = items; // store all units in marker

    markers.addLayer(marker);
    bounds.push([lat, lon]);
  }

  if (!isDataLoadedOnce && bounds.length > 0) {
    map.fitBounds(bounds, { padding: [30, 30] });
    isDataLoadedOnce = true;
  }
}

function buildUnitPopup(item) {
  var hqKey = (item.hq || "").trim();

  return `
    <div style="min-width:260px;font-family:'Segoe UI';border-radius:16px;overflow:hidden;background:white;">
      <div style="background:linear-gradient(135deg,#0d47a1,#1976d2);color:white;padding:12px 14px;font-weight:900;">
        ${escapeHtml(item.unitName)}
      </div>

      ${item.actualStrength ? `
        <div style="padding:10px 14px;background:#e3f2fd;color:#0d47a1;font-size:13px;">
          <b>Actual Strength</b><br>${escapeHtml(item.actualStrength)}
        </div>` : ""}

      ${item.availableStrength ? `
        <div style="padding:10px 14px;background:#fff3e0;color:#e65100;font-size:13px;">
          <b>Available Strength</b><br>${escapeHtml(item.availableStrength)}
        </div>` : ""}

      ${item.contact ? `
        <div style="padding:10px 14px;background:#f3e5f5;color:#4a148c;font-size:13px;">
          📞 <b>${escapeHtml(item.contact)}</b>
        </div>` : ""}
    </div>
  `;
}


window.showSingleUnitPopup = function(lat, lon, index) {

  markers.eachLayer(function(layer){

    var ll = layer.getLatLng();

    if (
      Math.abs(ll.lat - lat) < 0.000001 &&
      Math.abs(ll.lng - lon) < 0.000001
    ) {

      var items = layer._multiUnits;

      if (items && items[index]) {
        layer.setPopupContent(buildUnitPopup(items[index]));
        layer.openPopup();
      }
    }
  });

};

        function debounce(fn, wait) {
            var t = null;
            return function () {
                var ctx = this, args = arguments;
                clearTimeout(t);
                t = setTimeout(function () { fn.apply(ctx, args); }, wait);
            };
        }

        var debouncedRender = debounce(function () {
            renderMarkersFromCache();
        }, 180);

        function fetchDataOnceThenRender() {
            showLoading(true);

            fetch(sheetURL)
                .then(function (r) { return r.text(); })
                .then(function (tsv) {
                    parseTSVToCache(tsv);
                    fillTypeDropdownOnce();
                    renderMarkersFromCache();
                    showLoading(false);
                })
                .catch(function () {
                    showLoading(false);
                });
        }

        function startAutoRefresh() {
            setInterval(function () {
                if (sessionStorage.getItem("loggedIn") === "true") {
                    fetch(sheetURL)
                        .then(function (r) { return r.text(); })
                        .then(function (tsv) {
                            parseTSVToCache(tsv);
                            renderMarkersFromCache();
                        })
                        .catch(function () { });
                }
            }, 600000);
        }

        // ---------- GOOGLE PLACES (AUTOCOMPLETE + BUTTON SEARCH) ----------
        function loadGooglePlacesAfterLogin() {
            if (googlePlacesLoaded) return;
            googlePlacesLoaded = true;

            var script = document.createElement("script");
            script.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(GOOGLE_PLACES_API_KEY) + "&libraries=places";
            script.async = true;
            script.defer = true;

            script.onload = function () {
                initPlacesAutocomplete();
            };

            document.head.appendChild(script);
        }

        function initPlacesAutocomplete() {
            if (!window.google || !google.maps || !google.maps.places) return;

            // Service helpers for "Search" button
            geocoder = new google.maps.Geocoder();

            // ✅ Use Autocomplete (best for clicking suggestions)
            autocomplete = new google.maps.places.Autocomplete(pacInputEl, {
                fields: ["geometry", "name", "formatted_address"]
            });

            autocomplete.addListener("place_changed", function () {
                var place = autocomplete.getPlace();
                if (!place || !place.geometry || !place.geometry.location) return;
                lastSelectedPlace = place;
                goToPlace(place.geometry.location.lat(), place.geometry.location.lng(), place.name || place.formatted_address || "Place");
            });

            // Make sure clear button works
            clearBtn.onclick = function () {
                pacInputEl.value = "";
                clearBtn.style.display = "none";
                lastSelectedPlace = null;
                if (searchMarker && map) map.removeLayer(searchMarker);
            };

            pacInputEl.addEventListener("input", function () {
                clearBtn.style.display = this.value ? "block" : "none";
            });

            // ✅ Search button works even without Enter
            searchBtn.addEventListener("click", function () {
                runPlaceSearch();
            });

            // Optional: focus input when pin clicked
            pinBtn.addEventListener("click", function () {
                pacInputEl.focus();
            });
        }

        function runPlaceSearch() {
            var q = (pacInputEl.value || "").trim();
            if (!q) return;

            // If user already selected a suggestion, use it
            if (lastSelectedPlace && lastSelectedPlace.geometry && lastSelectedPlace.geometry.location) {
                var loc = lastSelectedPlace.geometry.location;
                goToPlace(loc.lat(), loc.lng(), lastSelectedPlace.name || q);
                return;
            }

            // Otherwise geocode typed text
            if (!geocoder) return;

            geocoder.geocode({ address: q }, function (results, status) {
                if (status === "OK" && results && results.length) {
                    var r = results[0];
                    if (r.geometry && r.geometry.location) {
                        goToPlace(r.geometry.location.lat(), r.geometry.location.lng(), r.formatted_address || q);
                    }
                } else {
                    // if geocode fails, try to trigger "Enter" behavior (some browsers)
                    pacInputEl.focus();
                }
            });
        }

        function goToPlace(lat, lng, label) {
            if (searchMarker && map) map.removeLayer(searchMarker);

            if (map) {
                searchMarker = L.marker([lat, lng]).addTo(map).bindPopup(label).openPopup();
                map.setView([lat, lng], 14);
            }
        }

        // ---------- INIT AFTER LOGIN ----------
        function initMapAndUIAfterLogin() {
            pageHeaderEl.style.display = "block";
            filterBoxEl.style.display = "block";
            topBarEl.style.display = "block";
            googleSearchBoxEl.style.display = "flex";

            buildLegendPanel();

            if (!map) {
                map = L.map('map', { zoomControl: true }).setView([23.5, 87.5], 7);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap',
                    maxZoom: 19
                }).addTo(map);

                markers = L.markerClusterGroup({
                    disableClusteringAtZoom: 13,
                    spiderfyOnMaxZoom: true,
                    showCoverageOnHover: false
                });
                map.addLayer(markers);

                setTimeout(function () { map.invalidateSize(); }, 300);
            }

            if (!uiEventsBound) {
                uiEventsBound = true;

                typeFilterEl.addEventListener("change", function () { debouncedRender(); });
                searchBoxEl.addEventListener("input", function () { debouncedRender(); });

                // Legend events
                document.addEventListener("change", function (e) {
                    if (!e.target) return;

                    if (e.target.id === "selectAllLegend") {
                        var checked = e.target.checked;

                        activeHQ.clear();
                        if (checked) {
                            for (var k in legendItems) activeHQ.add(k);
                        }

                        document.querySelectorAll(".unitShowCheck").forEach(function (cb) {
                            cb.checked = checked;
                        });

                        debouncedRender();
                    }

                    if (e.target.classList && e.target.classList.contains("unitShowCheck")) {
                        if (e.target.checked) activeHQ.add(e.target.value);
                        else activeHQ.delete(e.target.value);

                        var allChecks = document.querySelectorAll(".unitShowCheck");
                        var allOn = true;
                        allChecks.forEach(function (cb) { if (!cb.checked) allOn = false; });
                        selectAllLegendEl.checked = allOn;

                        debouncedRender();
                    }
                });

                // Enter key: run search (so both enter + click work)
                pacInputEl.addEventListener("keydown", function (e) {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        runPlaceSearch();
                    }
                });

                // Prevent enter in left search box
                searchBoxEl.addEventListener("keydown", function (e) {
                    if (e.key === "Enter") e.preventDefault();
                });

                // Mobile: fix map resize when orientation change
                window.addEventListener("resize", function () {
                    try { if (map) map.invalidateSize(); } catch (e) { }
                });
            }

            loadGooglePlacesAfterLogin();
            fetchDataOnceThenRender();
            startAutoRefresh();
        }

        // ---------- LOGIN / LOGOUT ----------
        function login() {
            var u = document.getElementById("username").value.trim();
            var p = document.getElementById("password").value.trim();
            var users = JSON.parse(localStorage.getItem("users"));

            if (users[u] && users[u] === p) {
                sessionStorage.setItem("loggedIn", "true");
                sessionStorage.setItem("currentUser", u);

                loggedUserEl.innerText = u;
                loginErrorEl.innerText = "";
                loginScreenEl.style.display = "none";

                initMapAndUIAfterLogin();
            } else {
                loginErrorEl.innerText = "Invalid Username or Password";
            }
        }

        function logout() {
            sessionStorage.clear();

            pageHeaderEl.style.display = "none";
            filterBoxEl.style.display = "none";
            topBarEl.style.display = "none";
            googleSearchBoxEl.style.display = "none";
            legendPanelEl.style.display = "none";
            userMenuEl.style.display = "none";
            userPanelModalEl.style.display = "none";
            showLoading(false);

            loginScreenEl.style.display = "flex";
            loginErrorEl.innerText = "";

            try {
                if (searchMarker && map) map.removeLayer(searchMarker);
                searchMarker = null;
            } catch (e) { }

            try { if (markers) markers.clearLayers(); } catch (e) { }

            try {
                typeFilterEl.value = "ALL";
                searchBoxEl.value = "";
                pacInputEl.value = "";
                clearBtn.style.display = "none";
            } catch (e) { }

            activeHQ.clear();
            for (var k in legendItems) activeHQ.add(k);
            selectAllLegendEl.checked = true;
            try {
                document.querySelectorAll(".unitShowCheck").forEach(function (cb) { cb.checked = true; });
            } catch (e) { }

            isDataLoadedOnce = false;
            lastSelectedPlace = null;
        }

        // ---------- USER MANAGEMENT ----------
        function createUser() {
            var u = document.getElementById("newUser").value.trim();
            var p = document.getElementById("newPass").value.trim();
            var users = JSON.parse(localStorage.getItem("users"));
            var userMsg = document.getElementById("userMsg");

            if (!u || !p) { userMsg.innerText = "Enter username & password"; return; }
            if (users[u]) { userMsg.innerText = "User already exists!"; return; }

            users[u] = p;
            localStorage.setItem("users", JSON.stringify(users));
            userMsg.innerText = "User created successfully!";
            document.getElementById("newUser").value = "";
            document.getElementById("newPass").value = "";
        }

        function changePassword() {
            var u = document.getElementById("changeUser").value.trim();
            var p = document.getElementById("changePass").value.trim();
            var users = JSON.parse(localStorage.getItem("users"));
            var userMsg = document.getElementById("userMsg");

            if (!u) { userMsg.innerText = "Enter username"; return; }
            if (!users[u]) { userMsg.innerText = "User not found!"; return; }
            if (!p) { userMsg.innerText = "Enter new password"; return; }

            users[u] = p;
            localStorage.setItem("users", JSON.stringify(users));
            userMsg.innerText = "Password changed!";
            document.getElementById("changeUser").value = "";
            document.getElementById("changePass").value = "";
        }

        function downloadUsersTxt() {
            var users = JSON.parse(localStorage.getItem("users")) || {};
            var lines = [];
            lines.push("# users.txt (TESTING ONLY - plaintext passwords)");
            lines.push("# format: username:password");
            lines.push("");

            Object.keys(users).sort().forEach(function (u) {
                lines.push(u + ":" + users[u]);
            });

            var blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
            var url = URL.createObjectURL(blob);

            var a = document.createElement("a");
            a.href = url;
            a.download = "users.txt";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            setTimeout(function () { URL.revokeObjectURL(url); }, 500);
            document.getElementById("userMsg").innerText = "users.txt downloaded (testing only).";
        }

        function toggleMenu() {
            userMenuEl.style.display = userMenuEl.style.display === "block" ? "none" : "block";
        }

        function openUserPanel() {
            userPanelModalEl.style.display = "flex";
            userMenuEl.style.display = "none";
            document.getElementById("userMsg").innerText = "";
        }

        function closeUserPanel() {
            userPanelModalEl.style.display = "none";
        }

        // Login enter key
        document.getElementById("username").addEventListener("keydown", function (e) {
            if (e.key === "Enter") login();
        });
        document.getElementById("password").addEventListener("keydown", function (e) {
            if (e.key === "Enter") login();
        });

        // Auto session
        if (sessionStorage.getItem("loggedIn") === "true") {
            var u = sessionStorage.getItem("currentUser") || "admin";
            loggedUserEl.innerText = u;
            loginScreenEl.style.display = "none";
            initMapAndUIAfterLogin();
        }
    </script>
